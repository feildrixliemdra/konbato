  <script>
    (function () {
      var ID = "05-steps";
      var gsap = window.gsap;
      var root = document.querySelector('#root[data-composition-id="' + ID + '"]');
      if (!gsap || !root) { return; }

      var world = root.querySelector(".f05-world");
      var stage = root.querySelector(".f05-stage");
      var board = root.querySelector(".f05-board");
      var cols = Array.prototype.slice.call(root.querySelectorAll(".f05-col"));
      var words = Array.prototype.slice.call(root.querySelectorAll(".f05-w"));
      var spike = root.querySelector(".f05-spike");
      var kickLabel = root.querySelector(".f05-kicklabel");
      var tags = Array.prototype.slice.call(root.querySelectorAll(".f05-tag"));

      /* ------------------------------------------------------------------
         Camera geometry — measured ONCE, at build time. Seek-safe by
         construction: no callback drives the transform, GSAP writes it.
         viewport-change, single wrapper at scale 1 => centre a world-space
         target at W/2 with translateX = W/2 - targetX.
         ------------------------------------------------------------------ */
      var stageRect = stage.getBoundingClientRect();
      var W = stageRect.width || 1920;
      var worldRect = world.getBoundingClientRect();
      var boardRect = board.getBoundingClientRect();
      var boardLeft = boardRect.left - worldRect.left;
      var centers = cols.map(function (col) {
        var r = col.getBoundingClientRect();
        return (r.left + r.width / 2) - worldRect.left;
      });
      var measured = centers.length === 3 && centers.every(function (c) { return isFinite(c) && c > 1; });
      if (!measured) {
        // layout not resolvable yet — fall back to the authored cqw grid
        var pad = 0.044 * W;
        var gap = 0.024 * W;
        var cw = (W - 2 * pad - 2 * gap) / 3;
        boardLeft = pad;
        centers = [0, 1, 2].map(function (i) { return pad + cw / 2 + i * (cw + gap); });
      }
      var stops = centers.map(function (c) { return W / 2 - c; });   // centre 01 / 02 / 03
      var startX = (W - boardLeft) + 0.012 * W;                     // row parked fully off the right edge
      var restX = 0;                                                // the sketch's own framing

      var tl = gsap.timeline({ paused: true });

      /* --- camera: start pose, then the three pan legs + the settle --- */
      gsap.set(world, { x: startX, y: 0, force3D: false });

      tl.fromTo(world, { x: startX },
        { x: stops[0], duration: 0.71, ease: "power2.inOut", immediateRender: false, force3D: false }, 0.85);
      tl.fromTo(world, { x: stops[0] },
        { x: stops[1], duration: 0.60, ease: "power2.inOut", immediateRender: false, force3D: false }, 1.66);
      tl.fromTo(world, { x: stops[1] },
        { x: stops[2], duration: 0.54, ease: "power2.inOut", immediateRender: false, force3D: false }, 2.36);
      tl.fromTo(world, { x: stops[2] },
        { x: restX, duration: 0.34, ease: "power2.out", immediateRender: false, force3D: false }, 2.90);

      /* --- beat 1: staggered arrival cascade (waterfall-entry: binary opacity, whip-from-below) --- */
      tl.set(spike, { opacity: 1, y: 34 }, 0.04);
      tl.to(spike, { y: 0, duration: 0.12, ease: "power4.out" }, 0.04);
      tl.set(kickLabel, { opacity: 1, y: 30 }, 0.13);
      tl.to(kickLabel, { y: 0, duration: 0.13, ease: "power4.out" }, 0.13);

      // heading words: anchor travels furthest, gaps shrink across the wave,
      // each word starts before the previous settles, the last word snaps hardest
      var W_T = [0.160, 0.320, 0.460, 0.575, 0.675];
      var W_D = [0.200, 0.160, 0.140, 0.155, 0.150];
      var W_Y = [76, 50, 44, 50, 72];
      words.forEach(function (w, i) {
        tl.set(w, { opacity: 1, y: W_Y[i] }, W_T[i]);
        tl.to(w, { y: 0, duration: W_D[i], ease: "power4.out" }, W_T[i]);
      });

      /* --- beat 3: the three tags bloom left to right, 0.2s apart, over the settled row --- */
      var TAGS_T = [3.12, 3.32, 3.52];
      tags.forEach(function (tag, i) {
        tl.fromTo(tag, { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", immediateRender: true }, TAGS_T[i]);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
