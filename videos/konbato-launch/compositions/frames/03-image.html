  <script>
    (function () {
      var COMP_ID = "03-image";

      function build() {
        var tl = gsap.timeline({ paused: true });
        var F = 1 / 60;

        /* ---------- Phase 1 · local 0.00–1.50 — waterfall-entry cascade ----------
           The eyebrow only: nothing of the tool is on screen yet. Each element is
           revealed by tl.set (opacity is binary 0→1 on an arrival, never a fade)
           and whips up from below on power4.out; the wave accelerates — the next
           element starts within ±2 frames of the previous settle. */
        var t0 = 0.12;
        tl.set("#f03-image-sp", { opacity: 1, y: 70 }, t0);
        tl.to("#f03-image-sp", { y: 0, duration: 0.19, ease: "power4.out" }, t0);

        var t1 = t0 + 0.19 + 2 * F;
        tl.set("#f03-image-w1", { opacity: 1, y: 48 }, t1);
        tl.to("#f03-image-w1", { y: 0, duration: 0.15, ease: "power4.out" }, t1);

        var t2 = t1 + 0.15 - F;
        tl.set("#f03-image-w2", { opacity: 1, y: 44 }, t2);
        tl.to("#f03-image-w2", { y: 0, duration: 0.14, ease: "power4.out" }, t2);

        var t3 = t2 + 0.14 - F;
        tl.set("#f03-image-w3", { opacity: 1, y: 52 }, t3);
        tl.to("#f03-image-w3", { y: 0, duration: 0.15, ease: "power4.out" }, t3);

        /* ---------- Phase 2 · local 1.50–3.20 — spring-pop-entrance ----------
           The real tool surface rises into place: a slight scale-down (0.94) plus a
           short rise, settling on power3.out — a long tail, no overshoot. The working
           area dominates the plate; the authored type holds the margin around it. */
        tl.fromTo(
          "#f03-image-plate",
          { scale: 0.94, opacity: 0, y: 30 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          1.5,
        );

        /* ---------- Phase 3 · local 3.20–4.20 — the two authored figures ----------
           They land together on a ~0.15s stagger and STOP. Deliberately never a
           counting tween: the plate beneath them is a still, so a running number
           would claim a live measurement. */
        tl.fromTo(
          "#f03-image-fig-local",
          { opacity: 0, y: 9 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          3.25,
        );
        tl.fromTo(
          "#f03-image-fig-size",
          { opacity: 0, y: 9 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          3.4,
        );

        /* ---------- Phase 4 · local 4.20–5.00 — held read ----------
           sine-wave-loop at the low end: 2px of jitter on the held surface, nothing
           else. No push, no breathing. Begins where the entrance settled, so the
           sin(0) offset is zero and there is no jump off the entry tail. */

          "#f03-image-plate",
          { y: -2, duration: 0.38, ease: "sine.inOut", yoyo: true, repeat: 1 },
