    /* ══ Phase 1 · 0.00–0.80s — eyebrow + heading: staggered arrival cascade ══
       waterfall-entry: binary reveal via tl.set (never a fade), one direction
       (from below), each element starting within ±1–2 frames of the previous

    var CASCADE = [
      { sel: ".f08-spike",      at: 0.10, rise: 30, dur: 0.12 }, // brand mark: 0.92 → 1
      { sel: ".f08-kicker-txt", at: 0.19, rise: 42, dur: 0.14 }, // light: snaps in

      { sel: ".f08-w2",         at: 0.50, rise: 50, dur: 0.15 }, // light word
      { sel: ".f08-w3",         at: 0.62, rise: 60, dur: 0.18 }  // normal word, longest settle
    ];
    CASCADE.forEach(function (w, i) {
      tl.set(w.sel, { opacity: 0 }, 0); // collapsed state stated explicitly at t=0 (seek-safe)
      var from = { opacity: 1, y: w.rise };
      var to = { y: 0, duration: w.dur, ease: "power4.out" };
      if (i === 0) { from.scale = 0.92; to.scale = 1; }

    [".f08-rail-1", ".f08-rail-2", ".f08-rail-3"].forEach(function (sel, i) {

       ~0.35s apart: rail ignites, body spring-pops, its lane tag settles after.
       03 Process (Worker) is the frame's single accent — it draws a breath longer. */
    var STAGE_AT = [1.70, 2.05, 2.40, 2.75];
    var RAIL_LIT = [".f08-rail-lit-1", ".f08-rail-lit-2", ".f08-rail-lit-3"]; // 04 sits under the rule
