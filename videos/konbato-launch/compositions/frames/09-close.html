  <script>
    // IIFE: sub-composition scripts execute in the HOST page's global scope
    // (the runtime clones the template contents into the host document), so a
    // top-level `const tl` collides with the host / a sibling frame and throws
    // "Identifier 'tl' has already been declared" — which silently leaves this
    // frame unregistered and static. Keep every declaration in this scope.
    (() => {
      window.__timelines = window.__timelines || {};

      // One paused timeline, registered under the root's data-composition-id.
      // House register: long-tail settles (power3.out), no overshoot — this is
      // the calm breather after eight frames of revelation.
      const tl = gsap.timeline({ paused: true, defaults: { duration: 0.6, ease: "power3.out" } });

      const band = document.getElementById("f09-band");
      const head = document.getElementById("f09-head");
      const sub = document.getElementById("f09-sub");
      const btn = document.getElementById("f09-btn");
      const trust = document.getElementById("f09-trust");
      const url = document.getElementById("f09-url");

      // Scene 1 (0.0-0.8s) — the end band fades up WHOLE: one move on the whole
      // card, no assembly. The ground does not change, so no blur: a plain calm
      // crossfade-in. (sub / button / trust / url are still at opacity 0 here.)
      tl.fromTo(band, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: "sine.inOut" }, 0);

      // Scene 2 (0.8-2.6s) — the heading rises into place on a long tail…
      tl.fromTo(head, { y: 30 }, { y: 0, duration: 1.2, ease: "power3.out" }, 0.8);
      // …then the site's own closing sentence fades in under it, given room
      // rather than decorated (it restates the whole film in the site's words).
      tl.fromTo(sub, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.85);

      // Scene 3 (2.6-3.4s) — the button settles: a short scale 0.96 -> 1.0 on a
      // long tail, deliberately NO overshoot (power eases cannot overshoot).
      tl.fromTo(btn, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.62, ease: "power3.out" }, 2.62);
      // …and the trust strip follows close under it, reading as one cluster.
      tl.fromTo(trust, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 2.78);

      // Scene 4 (3.4-4.0s) — the URL settles last, in ink rather than the accent
      // blue, so the button stays the frame's single accent moment. Hold to the
      // end: the harness crossfade is the exit, so no exit tween is authored.
      tl.fromTo(url, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.42);

      tl.seek(0);
      window.__timelines["09-close"] = tl;
