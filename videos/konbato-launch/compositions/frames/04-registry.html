    <script>
      (function () {
        "use strict";

        var root =
          (document.currentScript && document.currentScript.closest
            ? document.currentScript.closest("#root")
            : null) || document.getElementById("root");
        if (!root) return;

        var winEl = root.querySelector(".f04-window");
        var world = root.querySelector(".f04-world");
        var plate = root.querySelector(".f04-plate");
        var mat = root.querySelector(".f04-mat");
        var rail = root.querySelector(".f04-rail");
        var rule = root.querySelector(".f04-rule");
        var sub = root.querySelector(".f04-sub");
        var kick = root.querySelector(".f04-kick");
        var title = root.querySelector(".f04-title");
        var count = root.querySelector(".f04-count");
        var idxItems = Array.prototype.slice.call(
          root.querySelectorAll(".f04-idx"),
        );

        /* Landmarks live in the capture's OWN pixel space (the plate is a
           1920 x 7505 capture of the live registry page): 880 px is the
           registry heading block, 1650 px is the PDF half resting below it.
           Measuring the pass in the page's own pixels keeps it honest to the
           real surface instead of inventing a scroll distance. */
        var PLATE_W = 1920;
        var FROM_Y = 880;
        var TO_Y = 1650;

        /* The registry's own row geometry, measured off the capture: the
           centre of each row's title/icon line, not the midpoint between row
           separators (the page sits its icon a few pixels above that
           midpoint). The margin numbers ride these rows in the page's order,
           01–05 the Image tools and 06–15 the PDF ones. */
        var ROW_Y = [
          1243, 1331, 1421, 1511, 1599, 1766, 1854, 1943, 2031, 2121, 2211,
          2298, 2389, 2477, 2566,
        ];

        var plateW = plate.getBoundingClientRect().width || PLATE_W;
        var scale = plateW / PLATE_W;
        var baseY = FROM_Y * scale;
        var travel = (TO_Y - FROM_Y) * scale;
        var winH = winEl.clientHeight || 548;
        var camEnd = baseY + travel;

        idxItems.forEach(function (el, i) {
          var h = el.offsetHeight || 24;
          el.style.top = (ROW_Y[i] * scale - h / 2).toFixed(2) + "px";
        });

        /* Depth planes. Each plane covers the same camera distance in the same
           window, so its net rate is a fixed fraction of the surface's: the
           matting drifts at 0.34x (far) while the plate travels at 1.0x, with
           the window's own edge treatment as the static rig. Every plane is a
           plain transform tween — nothing depends on a callback firing during a
           seek. */
        var RATE_FAR = 0.34;
        var farY = -travel * RATE_FAR;

        var tl = gsap.timeline({ paused: true });

        /* Scene 1 — the count lands. Per-word staggered reveal with
           content-aware pacing: each word's window is derived from its own
           length (longer words earn more screen time), and the flat schedule
           is computed once here, never per frame. The counts are authored
           type, not readouts — nothing counts up. */
        var BASE_DURATION = 0.26;
        var SEC_PER_CHAR = 0.028;

        function revealLine(el, cue, stagger) {
          if (!el) return;
          var words = Array.prototype.slice.call(el.querySelectorAll(".f04-w"));
          words.forEach(function (wordEl, index) {
            var chars = (wordEl.textContent || "").trim().length;
            var dur = Math.min(
              0.62,
              Math.max(0.22, BASE_DURATION + chars * SEC_PER_CHAR),
            );
            tl.fromTo(
              wordEl,
              { opacity: 0, yPercent: 48 },
              { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" },
              cue + index * stagger,
            );
          });
        }

        tl.fromTo(
          winEl,
          { opacity: 0, y: 18, scale: 0.988 },
          { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "power3.out" },
          0.06,
        );
        tl.fromTo(
          plate,
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          0.34,
        );

        revealLine(kick, 0.12, 0.08);
        revealLine(title, 0.34, 0.17);
        revealLine(count, 1.44, 0.1);

        tl.fromTo(
          rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power2.inOut" },
          1.2,
        );
        tl.fromTo(
          sub,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          1.98,
        );

        /* Scene 2 + 3 — the forced-scroll pass. ONE continuous move down the
           real plate: it starts on the registry heading and ends 101 plate px
           above the PDF half, decelerating into the held final section (a
           slow-fast-slow tail, so it never reads as a scrollbar being
           released). The depth planes ride the same 3.6s window at their own
           fixed rates, so the parallax is a pure function of the playhead. */
        tl.fromTo(
          world,
          { y: -baseY },
          { y: -(baseY + travel), duration: 3.6, ease: "power2.inOut" },
          2.4,
        );
        tl.fromTo(
          mat,
          { y: 0 },
          { y: farY, duration: 3.6, ease: "power2.inOut" },
          2.4,
        );
        // the rail rides the surface at the page's own rate, so its numbers
        // stay glued to their rows all the way down
        tl.fromTo(
          rail,
          { y: -baseY },
          { y: -(baseY + travel), duration: 3.6, ease: "power2.inOut" },
          2.4,
        );

        /* Each row's number rises as the camera reaches that row. The cue is
           derived, not guessed: invert the pass's own ease to find the moment
           the row sits LEAD px below the frame, so the number lands with its
           row however the pass is retimed. */
        var CAM_START = 2.4;
        var CAM_DUR = 3.6;
        var LEAD = winH * 0.13;

        function invertEase(p) {
          return p < 0.5 ? Math.sqrt(p / 2) : 1 - Math.sqrt((1 - p) / 2);
        }

        idxItems.forEach(function (el, i) {
          var rowY = ROW_Y[i] * scale;
          if (rowY - camEnd > winH) return; // this row never reaches the frame
          var target = rowY - winH - LEAD;
          var p = Math.min(1, Math.max(0, (target - baseY) / travel));
          var cue = Math.max(
            CAM_START + 0.05 + i * 0.06,
            CAM_START + CAM_DUR * invertEase(p),
          );
          tl.fromTo(
            el,
            { opacity: 0, yPercent: 34 },
            { opacity: 1, yPercent: 0, duration: 0.55, ease: "power3.out" },
            cue,
          );
        });

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["04-registry"] = tl;
      })();
    </script>
