    @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/JetBrainsMono-700.woff2") format("woff2")}

    /* the frame root is styled by #root — never a class on the data-composition-id element */
    #root{

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      var TOTAL = 5; // = data-duration; the push is paced to this, never stretched

      var cam = document.querySelector(".f02-camera");

      /* multi-phase-camera · steady-push
         Channel 1 — the push:   scale 1.0  → 1.09   (decelerating, whole duration)
         Channel 2 — the counter-translateY:     0 → −40px (the framing drifts up the
                     page as the camera closes in, so the headline stays the target)
         Channel 3 — the drift clock: one slow sine cycle over the full duration; it is
                     what keeps the camera live on the last frame (a push that settles
                     into stillness turns a capture into a slide). */
      var push = { scale: 1, ty: 0 }; // phase channels — never read by CSS
      var drift = { p: 0 };           // drift clock (radians)

      var DRIFT_CYCLES = 1;
      var DRIFT_AMP_X = 2.5;
      var DRIFT_AMP_Y = 1.5;
      var DRIFT_FREQ_RATIO = 1.3; // ≠ 1.0: equal frequencies read as a mechanical diagonal

      // The ONE writer of cam.style.transform: phase scale + counter-translate + drift,
      // composed in a single place so nothing else can fight the camera for the property.
      function writeCamera() {
        var dx = Math.sin(drift.p) * DRIFT_AMP_X;
        var dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y;
        cam.style.transform =
          "scale(" + push.scale.toFixed(5) + ") translate(" +
          dx.toFixed(3) + "px, " + (push.ty + dy).toFixed(3) + "px)";
      }

      var tl = gsap.timeline({ paused: true });

      // the push + counter-translate, one continuous phase across all five seconds
      tl.to(push, { scale: 1.09, ty: -40, duration: TOTAL, ease: "power2.out" }, 0);
      // the drift clock spans the composition and is still travelling at t = TOTAL
      tl.to(
        drift,
        {
          p: Math.PI * 2 * DRIFT_CYCLES,
          duration: TOTAL,
          ease: "none",
          onUpdate: writeCamera,
        },
        0,
      );

      writeCamera(); // the t = 0 state, so the first frame is never un-transformed

      window.__timelines["02-hero"] = tl;
      tl.seek(0);
    })();
  </script>
